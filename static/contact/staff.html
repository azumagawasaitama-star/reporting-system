<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スタッフ - 連絡</title>
  <link rel="stylesheet" href="/static/contact/style.css" />
</head>
<body>
  <div class="container">
    <div id="form-view">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>新しい連絡を送る</h1>
        <button onclick="window.location.reload(true)" style="background:transparent; border:1px solid #ccc; padding:4px 8px; border-radius:4px; font-size:0.9em; cursor:pointer; color:#555;">🔄 再読み込み</button>
      </div>
      <div class="card">
        <label for="area-select">エリア</label>
        <select id="area-select"></select>

        <label for="staff-name">お名前</label>
        <input type="text" id="staff-name" placeholder="山田 太郎" />

        <label for="staff-message">連絡内容</label>
        
        <div style="position:relative;">
          <textarea id="staff-message" placeholder="状況を入力してください"></textarea>
          <label style="position:absolute; right:10px; bottom:15px; cursor:pointer; background:#f1f5f9; padding:4px 8px; border-radius:4px; border:1px solid #cbd5e1; font-size:0.9em;">
            📷 写真
            <input type="file" accept="image/*" style="display:none;" onchange="uploadPhoto(event, 'staff-message')">
          </label>
        </div>


        <div class="error-box" id="form-error"></div>
        <button class="primary" id="submit-btn">送信する</button>
      </div>

      <div id="history-section" style="margin-top: 30px; display: none;">
        <h2>過去の連絡履歴</h2>
        <p class="notice">この端末から送信した過去の連絡一覧です。タップするとやり取りの続きを確認できます。</p>
        <div id="history-list"></div>
      </div>
    </div>

    <div id="thread-view" style="display:none;">
      <a class="back-link" href="#" id="back-to-list">&larr; 新規作成・一覧に戻る</a>
      <h1 id="thread-title">連絡スレッド</h1>
      <p class="notice">この画面はあなたが送った連絡への返信専用です。他のスタッフのやり取りは表示されません。</p>
      <div class="thread" id="thread-messages"></div>

      <div class="reply-box" style="position:relative;">
        <textarea id="reply-text" placeholder="追記する..." style="padding-right: 70px;"></textarea>
        <label style="position:absolute; right:80px; bottom:15px; cursor:pointer; background:#f1f5f9; padding:4px 8px; border-radius:4px; border:1px solid #cbd5e1; font-size:0.9em; color:#333;">
          📷
          <input type="file" accept="image/*" style="display:none;" onchange="uploadPhoto(event, 'reply-text')">
        </label>
        <button class="primary" id="reply-btn">送信</button>
      </div>

    </div>
  </div>

  <script>
    const STORAGE_KEY = "staff_reports_history";

    function getHistory() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function addHistory(reportId, token, message) {
      const history = getHistory();
      // Remove if exists to push to top
      const filtered = history.filter(h => h.reportId !== reportId);
      filtered.unshift({
        reportId,
        token,
        preview: message.length > 20 ? message.substring(0, 20) + "..." : message,
        date: new Date().toISOString()
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
      renderHistory();
    }

    
    const CLOUDINARY_CLOUD_NAME = 'dujcnkle9';
    const CLOUDINARY_UPLOAD_PRESET = 'yt6zyddz';

    async function uploadPhoto(event, textareaId) {
      const file = event.target.files[0];
      if (!file) return;
      
      const textarea = document.getElementById(textareaId);
      const originalPlaceholder = textarea.placeholder;
      textarea.placeholder = "📷 画像をアップロード中...お待ちください";
      textarea.disabled = true;

      try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
              method: 'POST',
              body: formData
          });
          const data = await res.json();
          if (data.secure_url) {
              textarea.value += (textarea.value ? '\n' : '') + data.secure_url + '\n';
          }
      } catch (e) {
          alert("画像のアップロードに失敗しました");
      } finally {
          textarea.placeholder = originalPlaceholder;
          textarea.disabled = false;
          event.target.value = '';
          textarea.focus();
      }
    }

    function formatMessageText(text) {
        const escaped = escapeHtml(text);
        const urlRegex = /(https:\/\/res\.cloudinary\.com\/[^\s]+)/g;
        return escaped.replace(urlRegex, '<br><a href="$1" target="_blank"><img src="$1" style="max-width:100%; max-height:200px; border-radius:8px; margin-top:8px; border:1px solid #ccc;" /></a>');
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) {
          // If iso string doesn't have Z, add it for backend times
          return new Date(iso + "Z").toLocaleString("ja-JP", { hour: "2-digit", minute: "2-digit", month: "numeric", day: "numeric" });
      }
      return d.toLocaleString("ja-JP", { hour: "2-digit", minute: "2-digit", month: "numeric", day: "numeric" });
    }

    async function loadAreas() {
      const res = await fetch("/api/contact/areas");
      const areas = await res.json();
      const select = document.getElementById("area-select");
      if (areas.length === 0) {
        select.innerHTML = '<option value="">利用可能なエリアがありません</option>';
        return;
      }
      select.innerHTML = areas.map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
    }

    function renderHistory() {
      const history = getHistory();
      const section = document.getElementById("history-section");
      const list = document.getElementById("history-list");
      if (history.length === 0) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";
      list.innerHTML = history.map(h => `
        <div class="report-item" data-id="${h.reportId}" data-token="${h.token}">
          <div><strong>${escapeHtml(h.preview)}</strong></div>
          <div class="meta">${formatTime(h.date)}</div>
        </div>
      `).join("");

      list.querySelectorAll(".report-item").forEach(el => {
        el.addEventListener("click", () => {
          showThreadView(el.dataset.id, el.dataset.token);
        });
      });
    }

    async function submitReport() {
      const submitBtn = document.getElementById("submit-btn");
      if (submitBtn.disabled) return;

      const areaId = document.getElementById("area-select").value;
      const name = document.getElementById("staff-name").value.trim();
      const message = document.getElementById("staff-message").value.trim();
      const errorBox = document.getElementById("form-error");
      errorBox.textContent = "";

      if (!areaId) {
        errorBox.textContent = "エリアを選択してください。";
        return;
      }
      if (!name) {
        errorBox.textContent = "お名前を入力してください。";
        return;
      }
      if (!message) {
        errorBox.textContent = "連絡内容を入力してください。";
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch("/api/contact/staff/reports", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ area_id: areaId, staff_name: name, message }),
        });

        if (!res.ok) {
          errorBox.textContent = "送信に失敗しました。もう一度お試しください。";
          return;
        }

        const data = await res.json();
        addHistory(data.report_id, data.staff_token, message);
        document.getElementById("staff-message").value = ""; // clear form
        await showThreadView(data.report_id, data.staff_token);
      } finally {
        submitBtn.disabled = false;
      }
    }

    function showFormView() {
      activeReportId = null;
      activeToken = null;
      clearInterval(pollTimer);
      clearTimeout(reconnectTimer);
      if (currentWs) {
        currentWs.close();
        currentWs = null;
      }
      document.getElementById("thread-view").style.display = "none";
      document.getElementById("form-view").style.display = "block";
      renderHistory();
    }

    let currentWs = null;
    let pollTimer = null;
    let reconnectTimer = null;
    let activeReportId = null;
    let activeToken = null;

    function renderMessages(report) {
      const container = document.getElementById("thread-messages");
      const all = [
        {
          sender_role: "staff",
          sender_name: report.staff_name,
          text: report.message,
          created_at: report.created_at,
        },
        ...report.messages,
      ];
      container.innerHTML = all
        .map((m) => {
          const mineClass = m.sender_role === "staff" ? "mine" : "theirs";
          const label = m.sender_role === "staff" ? m.sender_name : `リーダー（${escapeHtml(m.sender_name)}）`;
          return `<div class="bubble ${mineClass}">
            <div class="sender">${label} ・ ${formatTime(m.created_at)}</div>
            <div>${formatMessageText(m.text)}</div>
          </div>`;
        })
        .join("");
      container.scrollTop = container.scrollHeight;
    }

    async function refreshThread() {
      if (!activeReportId) return;
      const r = await fetch(`/api/contact/reports/${activeReportId}?token=${encodeURIComponent(activeToken)}`);
      if (r.ok) {
        renderMessages(await r.json());
      }
    }

    function connectStaffWs() {
      if (!activeReportId) return;
      if (currentWs) {
        currentWs.onclose = null;
        currentWs.close();
      }
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      currentWs = new WebSocket(
        `${protocol}://${location.host}/ws/contact/staff/${activeReportId}?token=${encodeURIComponent(activeToken)}`
      );
      currentWs.onmessage = refreshThread;
      currentWs.onclose = () => {
        if (!activeReportId) return;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectStaffWs, 3000);
      };
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && activeReportId) {
        refreshThread();
        if (!currentWs || currentWs.readyState !== WebSocket.OPEN) {
          connectStaffWs();
        }
      }
    });

    async function showThreadView(reportId, token) {
      document.getElementById("form-view").style.display = "none";
      document.getElementById("thread-view").style.display = "block";
      document.getElementById("thread-messages").innerHTML = "読み込み中...";

      const res = await fetch(`/api/contact/reports/${reportId}?token=${encodeURIComponent(token)}`);
      if (!res.ok) {
        document.getElementById("thread-messages").innerHTML =
          '<p class="error-box">連絡が見つかりませんでした。期限切れか削除された可能性があります。</p>';
        return;
      }
      const report = await res.json();
      renderMessages(report);

      activeReportId = reportId;
      activeToken = token;
      connectStaffWs();

      clearInterval(pollTimer);
      pollTimer = setInterval(refreshThread, 5000);
    }

    async function sendReply() {
      if (!activeReportId || !activeToken) return;
      const textarea = document.getElementById("reply-text");
      const text = textarea.value.trim();
      if (!text) return;

      const replyBtn = document.getElementById("reply-btn");
      if (replyBtn.disabled) return;
      replyBtn.disabled = true;

      try {
        const res = await fetch(
          `/api/contact/staff/reports/${activeReportId}/messages?token=${encodeURIComponent(activeToken)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          }
        );
        if (res.ok) {
          textarea.value = "";
          refreshThread();
        }
      } finally {
        replyBtn.disabled = false;
      }
    }

    document.getElementById("submit-btn").addEventListener("click", submitReport);
    document.getElementById("reply-btn").addEventListener("click", sendReply);
    document.getElementById("back-to-list").addEventListener("click", (e) => {
      e.preventDefault();
      showFormView();
    });

    (async function init() {
      // Migrate old format to new array format if exists
      const oldSession = localStorage.getItem("staff_report_session");
      if (oldSession) {
        try {
          const parsed = JSON.parse(oldSession);
          if (parsed && parsed.reportId && parsed.token) {
            addHistory(parsed.reportId, parsed.token, "以前の連絡");
          }
        } catch(e) {}
        localStorage.removeItem("staff_report_session");
      }

      await loadAreas();
      renderHistory();
      
      const history = getHistory();
      if (history.length > 0) {
        // Automatically open the most recent one to match old behavior partially?
        // Actually, let's just show the form and history list.
      }
    })();
  </script>
</body>
</html>
