<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本部（マスター）画面</title>
  <link rel="stylesheet" href="/static/contact/style.css" />
  <style>
    .area-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0284c7;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="dashboard-view">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>本部用ダッシュボード（全エリア）</h1>
        <button onclick="window.location.reload(true)" style="background:transparent; border:1px solid #ccc; padding:4px 8px; border-radius:4px; font-size:0.9em; cursor:pointer; color:#555;">🔄 再読み込み</button>
      </div>

      <div class="card">
        <button class="secondary" id="enable-push-btn">🔔 全エリアの通知を受信する</button>
        <button class="danger" id="manage-areas-btn" style="margin-top:10px; background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">⚙️ エリア管理（削除など）</button>
        <div class="notice" id="push-status"></div>
      </div>
      
      <div class="card" id="area-management-card" style="display:none; border-color:#ef4444; background:#fef2f2;">
        <h3 style="margin-top:0; color:#b91c1c;">エリア管理</h3>
        <p class="notice">エリアを削除すると、そのエリア内の全ての報告とやり取りが完全に消去されます。</p>
        <div id="manage-area-list"></div>
      </div>


      <div id="list-view">
        <h2>全連絡一覧</h2>
        <div id="report-list"></div>
      </div>

      <div id="thread-view" style="display:none;">
        <a class="back-link" href="#" id="back-to-list">&larr; 一覧に戻る</a>
        <h2 id="thread-staff-name"></h2>
        <div id="ack-box" style="display:none;" class="notice"></div>
        <div class="thread" id="thread-messages"></div>
        <div class="reply-box">
          <textarea id="reply-text" placeholder="マスターとして返信する..."></textarea>
          <button class="primary" id="reply-btn">送信</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VAPID_PUBLIC_KEY = "BMdcqiGZYsaIzugJ3niAA3TaTV9QZHUOmrTrWubeVmy8SvAhywBDglSNXQ5QGGxHRDqLVEKv7LUrqUkyV2f3vkw";
    let currentReportId = null;
    let masterWs = null;
    let masterName = null;

    document.getElementById("manage-areas-btn").addEventListener("click", async () => {
      const card = document.getElementById("area-management-card");
      if (card.style.display === "none") {
        card.style.display = "block";
        const res = await fetch("/api/contact/areas");
        if (res.ok) {
          const areas = await res.json();
          const list = document.getElementById("manage-area-list");
          list.innerHTML = areas.map(a => `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid #fca5a5;">
              <span>${escapeHtml(a.name)}</span>
              <button onclick="deleteArea('${a.id}', '${escapeHtml(a.name)}')" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">削除</button>
            </div>
          `).join("");
        }
      } else {
        card.style.display = "none";
      }
    });

    async function deleteArea(areaId, areaName) {
      if (!confirm(`本当によろしいですか？\nエリア「${areaName}」と、それに紐づくすべての報告データが完全に消去されます。`)) return;
      const res = await fetch(`/api/contact/areas/${areaId}`, { method: "DELETE" });
      if (res.ok) {
        document.getElementById("area-management-card").style.display = "none";
        await loadReportList();
      }
    }


    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    
    const CLOUDINARY_CLOUD_NAME = 'dujcnkle9';
    const CLOUDINARY_UPLOAD_PRESET = 'yt6zyddz';

    async function uploadPhoto(event, textareaId) {
      const file = event.target.files[0];
      if (!file) return;
      
      const textarea = document.getElementById(textareaId);
      const originalPlaceholder = textarea.placeholder;
      textarea.placeholder = "📷 画像をアップロード中...お待ちください";
      textarea.disabled = true;

      try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
              method: 'POST',
              body: formData
          });
          const data = await res.json();
          if (data.secure_url) {
              textarea.value += (textarea.value ? '\n' : '') + data.secure_url + '\n';
          }
      } catch (e) {
          alert("画像のアップロードに失敗しました");
      } finally {
          textarea.placeholder = originalPlaceholder;
          textarea.disabled = false;
          event.target.value = '';
          textarea.focus();
      }
    }

    function formatMessageText(text) {
        const escaped = escapeHtml(text);
        const urlRegex = /(https:\/\/res\.cloudinary\.com\/[^\s]+)/g;
        return escaped.replace(urlRegex, '<br><a href="$1" target="_blank"><img src="$1" style="max-width:100%; max-height:200px; border-radius:8px; margin-top:8px; border:1px solid #ccc;" /></a>');
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(iso) {
      const d = new Date(iso + "Z");
      return d.toLocaleString("ja-JP", { hour: "2-digit", minute: "2-digit", month: "numeric", day: "numeric" });
    }

    function getMasterName() {
      if (masterName) return masterName;
      masterName = localStorage.getItem("master_name");
      if (!masterName) {
        masterName = prompt("お名前を入力してください（返信の送信者名として使われます）") || "本部スタッフ";
        localStorage.setItem("master_name", masterName);
      }
      return masterName;
    }

    async function loadReportList() {
      const res = await fetch(`/api/contact/reports`);
      if (!res.ok) return;
      const reports = await res.json();
      const listEl = document.getElementById("report-list");
      if (reports.length === 0) {
        listEl.innerHTML = '<p class="notice">まだ連絡はありません。</p>';
        return;
      }
      reports.sort((a, b) => {
        const aPending = a.acknowledged_at ? 0 : 1;
        const bPending = b.acknowledged_at ? 0 : 1;
        return bPending - aPending;
      });
      listEl.innerHTML = reports
        .map((r) => {
          const badge = !r.acknowledged_at
            ? '<span style="color:#dc2626;font-weight:600;">【未対応】</span> '
            : "";
          return `<div class="report-item" data-id="${r.id}">
            <div><span class="area-badge">${escapeHtml(r.area_name)}</span> ${badge}<strong>${escapeHtml(r.staff_name)}</strong></div>
            <div style="margin-top:4px;">${escapeHtml(r.message)}</div>
            <div class="meta">${formatTime(r.created_at)}</div>
          </div>`;
        })
        .join("");
      listEl.querySelectorAll(".report-item").forEach((el) => {
        el.addEventListener("click", () => openThread(el.dataset.id));
      });
    }

    function renderThreadMessages(report) {
      const container = document.getElementById("thread-messages");
      const all = [
        {
          sender_role: "staff",
          sender_name: report.staff_name,
          text: report.message,
          created_at: report.created_at,
        },
        ...report.messages,
      ];
      container.innerHTML = all
        .map((m) => {
          const mineClass = m.sender_role === "leader" || m.sender_role === "master" ? "mine" : "theirs";
          const label = mineClass === "mine" ? `本部/リーダー（${escapeHtml(m.sender_name)}）` : escapeHtml(m.sender_name);
          return `<div class="bubble ${mineClass}">
            <div class="sender">${label} ・ ${formatTime(m.created_at)}</div>
            <div>${formatMessageText(m.text)}</div>
          </div>`;
        })
        .join("");
      container.scrollTop = container.scrollHeight;
    }

    function renderAckBox(report) {
      const box = document.getElementById("ack-box");
      box.style.display = "block";
      if (report.acknowledged_at) {
        box.innerHTML = `対応済み（${formatTime(report.acknowledged_at)}）`;
      } else {
        box.innerHTML = `<span style="color:#dc2626;">未対応です。</span> <button class="secondary" id="ack-btn">対応します</button>`;
        document.getElementById("ack-btn").addEventListener("click", () => ackReport(report.id));
      }
    }

    async function ackReport(reportId) {
      await fetch(`/api/contact/reports/${reportId}/acknowledge`, { method: "POST" });
      await refreshCurrentThreadIfOpen(reportId);
      await loadReportList();
    }

    async function openThread(reportId) {
      currentReportId = reportId;
      document.getElementById("list-view").style.display = "none";
      document.getElementById("thread-view").style.display = "block";
      const res = await fetch(`/api/contact/reports/${reportId}`);
      if (!res.ok) return;
      const report = await res.json();
      document.getElementById("thread-staff-name").textContent = `【${report.area_name}】${report.staff_name} さんの連絡`;
      renderThreadMessages(report);
      renderAckBox(report);
    }

    async function refreshCurrentThreadIfOpen(reportId) {
      if (currentReportId === reportId && document.getElementById("thread-view").style.display !== "none") {
        const res = await fetch(`/api/contact/reports/${reportId}`);
        if (res.ok) {
          const report = await res.json();
          renderThreadMessages(report);
          renderAckBox(report);
        }
      }
    }

    async function sendMasterReply() {
      const textarea = document.getElementById("reply-text");
      const text = textarea.value.trim();
      if (!text || !currentReportId) return;
      const res = await fetch(`/api/contact/reports/${currentReportId}/reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender_name: getMasterName(), text }),
      });
      if (res.ok) {
        textarea.value = "";
        const r = await fetch(`/api/contact/reports/${currentReportId}`);
        if (r.ok) renderThreadMessages(await r.json());
      }
    }

    document.getElementById("back-to-list").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("thread-view").style.display = "none";
      document.getElementById("list-view").style.display = "block";
      currentReportId = null;
    });
    document.getElementById("reply-btn").addEventListener("click", sendMasterReply);

    function withTimeout(promise, ms, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
      ]);
    }

    async function enablePush() {
      const statusEl = document.getElementById("push-status");
      statusEl.textContent = "";

      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        statusEl.textContent = "このブラウザは通知に対応していません。";
        return;
      }

      try {
        statusEl.textContent = "通知の許可を確認しています...";
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          statusEl.textContent = "通知が許可されませんでした。";
          return;
        }

        statusEl.textContent = "登録しています...";
        const reg = await navigator.serviceWorker.register("/contact/sw.js", { scope: "/contact/" });
        await withTimeout(navigator.serviceWorker.ready, 8000, "service worker ready timeout");

        statusEl.textContent = "購読しています...";
        const subscription = await withTimeout(
          reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
          }),
          8000,
          "subscribe timeout"
        );

        const subJson = subscription.toJSON();
        await fetch(`/api/contact/subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // area_id は送らない（=マスターとして全通知を受け取る）
          body: JSON.stringify({ ...subJson, alert_repeat_enabled: true }),
        });
        statusEl.textContent = "通知を有効にしました。";
      } catch (e) {
        console.error(e);
        statusEl.textContent = `通知の設定に失敗しました。詳細: ${e}`;
      }
    }
    document.getElementById("enable-push-btn").addEventListener("click", enablePush);

    let reconnectTimer = null;

    function connectMasterWs() {
      if (masterWs) {
        masterWs.onclose = null;
        masterWs.close();
      }
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      masterWs = new WebSocket(`${protocol}://${location.host}/ws/contact/master`);
      masterWs.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "area_deleted" || data.type === "report_deleted" || data.type === "reports_cleared") {
            if (currentReportId && data.report_id === currentReportId || (data.type === "reports_cleared" || data.type === "area_deleted")) {
                document.getElementById("thread-view").style.display = "none";
                document.getElementById("list-view").style.display = "block";
                currentReportId = null;
            }
        }
        await loadReportList();
        if ((data.type === "message" || data.type === "acknowledged") && data.report_id) {
          await refreshCurrentThreadIfOpen(data.report_id);
        }
      };
      masterWs.onclose = () => {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectMasterWs, 3000);
      };
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadReportList();
        if (currentReportId) refreshCurrentThreadIfOpen(currentReportId);
        if (!masterWs || masterWs.readyState !== WebSocket.OPEN) {
          connectMasterWs();
        }
      }
    });

    let masterPollTimer = null;

    (async function init() {
      await loadReportList();
      
      clearInterval(masterPollTimer);
      masterPollTimer = setInterval(async () => {
        await loadReportList();
        if (currentReportId) await refreshCurrentThreadIfOpen(currentReportId);
      }, 5000);
      
      connectMasterWs();
    })();
  </script>
</body>
</html>
